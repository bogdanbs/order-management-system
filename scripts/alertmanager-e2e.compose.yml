# Overrides for scripts/test-alertmanager-notification.sh: runs the real alertmanager service from
# docker-compose.yml against a fake Slack endpoint, isolated from a running local stack.
services:
  alertmanager:
    container_name: am-e2e-alertmanager
    ports: !reset []
    environment:
      SLACK_WEBHOOK_URL: http://fake-slack:8080/hook

  fake-slack:
    image: python:3.12-alpine
    command:
      - python
      - -u
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer

        class Hook(BaseHTTPRequestHandler):
            def do_POST(self):
                body = self.rfile.read(int(self.headers["Content-Length"]))
                print("SLACK " + self.path + " " + body.decode(), flush=True)
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")

        HTTPServer(("", 8080), Hook).serve_forever()
