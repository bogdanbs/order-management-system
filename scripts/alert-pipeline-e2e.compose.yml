# Overrides for scripts/test-alert-pipeline.sh: runs the real prometheus and alertmanager services from
# docker-compose.yml against a fake scrape target and a fake Slack endpoint, isolated from a running local stack.
services:
  prometheus:
    container_name: am-e2e-prometheus
    ports: !reset []

  alertmanager:
    container_name: am-e2e-alertmanager
    ports: !reset []
    environment:
      SLACK_WEBHOOK_URL: http://fake-slack:8080/hook

  # Answers Prometheus' scrape of order-service:8080 with two FAILED outbox records.
  fake-order-service:
    image: python:3.12-alpine
    networks:
      default:
        aliases: [order-service]
    command:
      - python
      - -u
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer

        METRICS = b"# TYPE outbox_records_failed gauge\noutbox_records_failed 2\n"

        class Metrics(BaseHTTPRequestHandler):
            def do_GET(self):
                self.send_response(200 if self.path == "/actuator/prometheus" else 404)
                self.send_header("Content-Type", "text/plain; version=0.0.4")
                self.end_headers()
                self.wfile.write(METRICS)

        HTTPServer(("", 8080), Metrics).serve_forever()

  fake-slack:
    image: python:3.12-alpine
    command:
      - python
      - -u
      - -c
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer

        class Hook(BaseHTTPRequestHandler):
            def do_POST(self):
                body = self.rfile.read(int(self.headers["Content-Length"]))
                print("SLACK " + self.path + " " + body.decode(), flush=True)
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")

        HTTPServer(("", 8080), Hook).serve_forever()
