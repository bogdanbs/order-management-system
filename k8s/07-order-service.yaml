apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      initContainers:
        - name: wait-postgres
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"
        - name: wait-kafka
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - "until nc -z orders-kafka-kafka-bootstrap 9092; do echo waiting for kafka; sleep 2; done"
      containers:
        - name: order-service
          image: order-management-system-order-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: orders-db
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: orders-db
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: orders-db
                  key: SPRING_DATASOURCE_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: orders-kafka-kafka-bootstrap:9092
            - name: OTEL_SERVICE_NAME
              value: order-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger:4318/v1/traces
            - name: LOKI_URL
              value: http://loki:3100
            - name: APP_OUTBOX_MODE
              value: polling
            - name: KAFKA_CONNECT_URL
              value: http://kafka-connect:8083
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: orders
spec:
  selector:
    app: order-service
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30090
