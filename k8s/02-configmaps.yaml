apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: orders
data:
  init-db.sql: |
    CREATE SCHEMA IF NOT EXISTS event_store;
    CREATE SCHEMA IF NOT EXISTS outbox;
    CREATE SCHEMA IF NOT EXISTS query_side;

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: orders
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: order-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['order-service:8080']

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: orders
data:
  local-config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      allow_structured_metadata: false

    analytics:
      reporting_enabled: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: orders
data:
  datasources.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        uid: prometheus

      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        uid: jaeger
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            tags:
              - key: service.name
                value: app
            customQuery: true
            query: '{app="${__tags.service.name}"} |= "${__span.traceId}"'

      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        uid: loki
        jsonData:
          derivedFields:
            - matcherRegex: 'traceId=([a-f0-9]{32})'
              name: TraceID
              url: 'http://localhost:16686/trace/$${__value.raw}'
              datasourceUid: jaeger

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: orders
data:
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: debezium-connector
  namespace: orders
data:
  debezium-pg-connector.json: |
    {
      "name": "orders-outbox-connector",
      "config": {
        "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
        "database.hostname": "postgres",
        "database.port": "5432",
        "database.user": "orders_user",
        "database.password": "${secrets:orders/orders-db:POSTGRES_PASSWORD}",
        "database.dbname": "orders_db",
        "database.server.name": "orders",
        "table.include.list": "outbox.outbox_events",
        "plugin.name": "pgoutput",
        "topic.prefix": "orders",
        "transforms": "outbox",
        "transforms.outbox.type": "io.debezium.transforms.outbox.EventRouter",
        "transforms.outbox.table.field.event.id": "id",
        "transforms.outbox.table.field.event.key": "aggregate_id",
        "transforms.outbox.table.field.event.type": "event_type",
        "transforms.outbox.table.field.event.payload": "payload",
        "transforms.outbox.route.by.field": "aggregate_type",
        "transforms.outbox.route.topic.replacement": "order.events",
        "slot.name": "orders_outbox_slot",
        "publication.name": "orders_outbox_publication"
      }
    }
