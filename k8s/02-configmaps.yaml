apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: orders
data:
  init-db.sql: |
    CREATE SCHEMA IF NOT EXISTS event_store;
    CREATE SCHEMA IF NOT EXISTS outbox;
    CREATE SCHEMA IF NOT EXISTS query_side;

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: orders
data:
  # prometheus.yml and alerts.yml must match infrastructure/prometheus/ (scripts/check-k8s-monitoring-sync.py).
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - alerts.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']

    scrape_configs:
      - job_name: order-service
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['order-service:8080']
  alerts.yml: |
    groups:
      - name: outbox
        rules:
          # Every replica reports the same database count, so max() yields one alert instead of one per instance.
          - alert: OutboxRecordsFailed
            expr: max(outbox_records_failed) > 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: Outbox events failed to publish
              description: >-
                {{ $value }} outbox records are FAILED after exhausting their retries; their events never reached Kafka.
                Inspect outbox.outbox_events WHERE status = 'FAILED'.

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: orders
data:
  # Must match infrastructure/alertmanager/alertmanager.yml (scripts/check-k8s-monitoring-sync.py).
  alertmanager.yml: |
    route:
      receiver: slack
      group_by: [alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

    receivers:
      - name: slack
        slack_configs:
          # Written from SLACK_WEBHOOK_URL at container start (Compose) or mounted from a Secret (Kubernetes).
          - api_url_file: /alertmanager/secrets/slack_webhook_url
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
            text: "{{ range .Alerts }}*{{ .Annotations.summary }}* ({{ .Labels.severity }})\n{{ .Annotations.description }}\n{{ end }}"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: orders
data:
  local-config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      allow_structured_metadata: false

    analytics:
      reporting_enabled: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: orders
data:
  datasources.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        uid: prometheus

      - name: Jaeger
        type: jaeger
        access: proxy
        url: http://jaeger:16686
        uid: jaeger
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            tags:
              - key: service.name
                value: app
            customQuery: true
            query: '{app="${__tags.service.name}"} |= "${__span.traceId}"'

      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        uid: loki
        jsonData:
          derivedFields:
            - matcherRegex: 'traceId=([a-f0-9]{32})'
              name: TraceID
              url: 'http://localhost:16686/trace/$${__value.raw}'
              datasourceUid: jaeger

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: orders
data:
  dashboards.yml: |
    apiVersion: 1

    providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards
