apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.58
          securityContext:
            runAsUser: 0
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: SPAN_STORAGE_TYPE
              value: badger
            - name: BADGER_EPHEMERAL
              value: "false"
            - name: BADGER_DIRECTORY_KEY
              value: /badger/key
            - name: BADGER_DIRECTORY_VALUE
              value: /badger/data
          ports:
            - containerPort: 16686
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - name: jaeger-data
              mountPath: /badger
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: jaeger-data
          persistentVolumeClaim:
            claimName: jaeger-data

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: orders
spec:
  selector:
    app: jaeger
  type: NodePort
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
      nodePort: 30686
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
