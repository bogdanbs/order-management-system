apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: kafka-connect
  namespace: orders
spec:
  version: 4.3.0
  replicas: 1
  bootstrapServers: orders-kafka-kafka-bootstrap:9092
  # Custom image: Strimzi Kafka Connect base + Debezium PostgreSQL plugin
  image: orders-kafka-connect:1.0.0
  groupId: connect-cluster
  offsetStorageTopic: _connect-offsets
  configStorageTopic: _connect-configs
  statusStorageTopic: _connect-status
  config:
    config.storage.replication.factor: 3
    offset.storage.replication.factor: 3
    status.storage.replication.factor: 3
    key.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: false
    value.converter.schemas.enable: false
  readinessProbe:
    initialDelaySeconds: 30
    timeoutSeconds: 5
  livenessProbe:
    initialDelaySeconds: 300
    timeoutSeconds: 5
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
