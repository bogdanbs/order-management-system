apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: orders
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
            # Links in Slack messages; matches the port-forward in k8s/README.md.
            - "--web.external-url=http://localhost:9093"
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: alertmanager-config
              mountPath: /etc/alertmanager/alertmanager.yml
              subPath: alertmanager.yml
            - name: alertmanager-storage
              mountPath: /alertmanager
            - name: alertmanager-slack
              mountPath: /alertmanager/secrets
              readOnly: true
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: alertmanager-config
          configMap:
            name: alertmanager-config
        - name: alertmanager-storage
          emptyDir: {}
        # Without the Secret the pod still starts; Slack notifications then fail and are logged.
        - name: alertmanager-slack
          secret:
            secretName: alertmanager-slack
            optional: true

---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: orders
spec:
  selector:
    app: alertmanager
  ports:
    - port: 9093
      targetPort: 9093
