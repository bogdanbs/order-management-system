spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/orders_db
    username: orders_user
    password: ${SPRING_DATASOURCE_PASSWORD:orders_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    schemas: event_store,outbox,query_side
    default-schema: event_store
    create-schemas: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8080/realms/orders/protocol/openid-connect/certs}
  kafka:
    bootstrap-servers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    com.orders: DEBUG
    org.hibernate.SQL: WARN

loki:
  url: ${LOKI_URL:http://localhost:3100}

app:
  outbox:
    mode: ${APP_OUTBOX_MODE:polling}
    polling-interval-ms: 5000
    # Published rows (polling) or all rows (CDC) are deleted after this many hours.
    retention-hours: 24
    cleanup-interval-ms: 3600000
    metrics-refresh-ms: 30000
  snapshot:
    threshold: 50
  cdc:
    kafka-connect-url: ${KAFKA_CONNECT_URL:http://kafka-connect:8083}
