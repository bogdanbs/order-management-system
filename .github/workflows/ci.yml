name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit and slice tests (Surefire) plus Testcontainers integration tests (Failsafe).
      - run: mvn -B verify

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/

  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same Prometheus image as docker-compose.yml and k8s/10-prometheus.yaml.
      - name: Test alert rules
        run: >-
          docker run --rm -v "$PWD/infrastructure/prometheus:/etc/prometheus" -w /etc/prometheus
          --entrypoint promtool prom/prometheus:v2.53.0 test rules alerts.test.yml

      - name: Check Prometheus config
        run: >-
          docker run --rm -v "$PWD/infrastructure/prometheus:/etc/prometheus"
          --entrypoint promtool prom/prometheus:v2.53.0 check config /etc/prometheus/prometheus.yml

      # Same Alertmanager image as docker-compose.yml and k8s/15-alertmanager.yaml.
      - name: Check Alertmanager config
        run: >-
          docker run --rm -v "$PWD/infrastructure/alertmanager:/etc/alertmanager"
          --entrypoint amtool prom/alertmanager:v0.27.0 check-config /etc/alertmanager/alertmanager.yml

      - name: Test outbox alert routes to Slack
        run: >-
          docker run --rm -v "$PWD/infrastructure/alertmanager:/etc/alertmanager"
          --entrypoint amtool prom/alertmanager:v0.27.0 config routes test
          --config.file=/etc/alertmanager/alertmanager.yml --verify.receivers=slack
          alertname=OutboxRecordsFailed severity=warning

      # Prometheus scrapes a fake target, fires OutboxRecordsFailed, and Alertmanager posts it to a fake Slack.
      - name: Test alert pipeline end to end
        run: bash scripts/test-alert-pipeline.sh

      - name: Check k8s ConfigMaps match their sources
        run: python3 scripts/check-k8s-monitoring-sync.py
