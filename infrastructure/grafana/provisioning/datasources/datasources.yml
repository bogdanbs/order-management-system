apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    uid: prometheus

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    uid: jaeger
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        tags:
          - key: service.name
            value: app
        customQuery: true
        query: '{app="${__tags.service.name}"} |= "${__span.traceId}"'

  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki
    jsonData:
      derivedFields:
        - matcherRegex: 'traceId=([a-f0-9]{32})'
          name: TraceID
          url: 'http://localhost:16687/trace/$${__value.raw}'
          datasourceUid: jaeger
